<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>📝 Todo List</h1>
      <p class="subtitle">Kelola tugas harianmu dengan mudah</p>
    </header>

    <section class="controls">
      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="Nama tugas..."
          autocomplete="off"
          required
        />

        <div class="form-grid">
          <label class="field">
            <span>📅 Tanggal</span>
            <input id="todo-date" type="date" />
          </label>

          <label class="field">
            <span>👤 Pelaksana</span>
            <input
              id="todo-assignee"
              type="text"
              placeholder="Nama pelaksana"
              autocomplete="off"
            />
          </label>

          <label class="field">
            <span>⏱️ Kategori Waktu</span>
            <select id="todo-duration">
              <option value="">— Pilih —</option>
              <option value="cepat">Cepat (&lt; 30 menit)</option>
              <option value="sedang">Sedang (30 menit – 2 jam)</option>
              <option value="lama">Lama (&gt; 2 jam)</option>
              <option value="harian">Harian</option>
              <option value="mingguan">Mingguan</option>
              <option value="bulanan">Bulanan</option>
            </select>
          </label>
        </div>

        <button type="submit" class="btn-primary">Tambah Tugas</button>
      </form>

      <div class="search-bar">
        <input
          id="search-input"
          type="search"
          placeholder="🔍 Cari tugas atau pelaksana..."
          autocomplete="off"
        />
      </div>

      <div class="filters" role="tablist">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Aktif</button>
        <button class="filter-btn" data-filter="completed">Selesai</button>
      </div>
    </section>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="app-footer">
      <span id="items-count">0 tugas</span>
      <button id="clear-completed" class="btn-link">Hapus yang selesai</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
